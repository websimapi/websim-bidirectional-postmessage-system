<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bidirectional PostMessage System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>PostMessage Communication Hub</h1>
        
        <div class="control-panel">
            <h2>Add an iframe</h2>
            <div class="input-group">
                <input type="text" id="iframe-url" placeholder="Enter URL to embed (e.g., https://example.com)">
                <button id="add-iframe">Add iframe</button>
            </div>
        </div>
        
        <div class="communication-panel">
            <div class="message-input">
                <h2>Send a message</h2>
                <textarea id="message-content" placeholder="Type your message here..."></textarea>
                <button id="send-message">Send Message to All</button>
            </div>
            
            <div class="message-log">
                <h2>Message Log</h2>
                <div id="log-container"></div>
            </div>
        </div>
        
        <div class="iframe-container" id="iframe-container">
            <h2>Embedded iframes</h2>
            <!-- iframes will be added here dynamically -->
        </div>
    </div>

    <script type="module" src="config.js"></script>
    <script type="module" src="script.js"></script>

</body>
</html>
